<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Akalie, logo : formes du a (v5)</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,800&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
<style>
  :root { --rose:#FF3D8B; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #ECE8E4; font-family: Onest, sans-serif; color: #0B0B0F; padding: 28px; width: 1120px; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  p.sous { font-size: 13px; color: #555; margin-bottom: 18px; }
  .grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .carte { background: #fff; border-radius: 18px; padding: 18px; display: grid; grid-template-columns: 170px 1fr; gap: 16px; align-items: center; }
  .i170 { width: 170px; height: 170px; border-radius: 38px; overflow: hidden; }
  .petits { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .i60 { width: 60px; height: 60px; border-radius: 14px; overflow: hidden; }
  .i30 { width: 30px; height: 30px; border-radius: 7px; overflow: hidden; }
  .num { font: 700 20px Onest; color: var(--rose); }
  .txt { font-size: 12.5px; color: #555; line-height: 1.35; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<h1>Le « a » : 6 formes (fond noir, dégradé irisé, étoile)</h1>
<p class="sous">Plus d'encoche dans la hampe : c'est elle qui faisait lire « oi ». L'étoile flotte à part, en haut à droite.</p>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="20" y1="28" x2="80" y2="82">
    <stop offset="0" stop-color="#FFE2D2"/><stop offset=".38" stop-color="#F9A9CF"/><stop offset=".72" stop-color="#D3B8FF"/><stop offset="1" stop-color="#B9A6FF"/></linearGradient>
  <linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7DB5"/><stop offset="1" stop-color="#C9A8FF"/></linearGradient>
  <path id="etoile" d="M0-9C1-3 3-1 9 0C3 1 1 3 0 9C-1 3-3 1-9 0C-3-1-1-3 0-9Z"/>
  <rect id="fond" width="100" height="100" fill="#0B0B0F"/>
</defs></svg>

<div class="grille" id="grille"></div>

<script>
const ETOILE = (x, y, s = 1) => `<use href="#etoile" transform="translate(${x} ${y}) scale(${s})" fill="url(#e)"/>`;
const formes = [
  ['1', 'Géométrique soudé', 'Le a actuel, mais la boucle touche la hampe et la hampe ne dépasse plus. Une seule forme, sans point.',
   `<circle cx="44" cy="57" r="19" fill="none" stroke="url(#g)" stroke-width="11"/>
    <rect x="58" y="32.5" width="11" height="48" rx="5.5" fill="url(#g)"/>${ETOILE(79, 24, 1.05)}`],
  ['2', 'Avec une queue', 'La hampe finit par une petite courbe vers la droite, comme une écriture à la main. Impossible de lire « i ».',
   `<circle cx="43" cy="57" r="19" fill="none" stroke="url(#g)" stroke-width="11"/>
    <path d="M62.5 38 V70 Q62.5 80 72 80" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round"/>${ETOILE(79, 25, 1.05)}`],
  ['3', 'Lourd et compact', 'Trait plus épais, boucle et hampe fondues en un seul bloc. Le plus solide en tout petit.',
   `<circle cx="45" cy="56" r="17.5" fill="none" stroke="url(#g)" stroke-width="15"/>
    <rect x="56.5" y="31" width="15" height="50" rx="7.5" fill="url(#g)"/>${ETOILE(80, 22, 1.05)}`],
  ['4', 'La lettre de la typo', 'Le a de la typo Onest (celle du nom), en très gras. Même lettre que dans « akalie ».',
   `<text x="46" y="76" text-anchor="middle" font-family="Onest" font-weight="800" font-size="100" fill="url(#g)">a</text>${ETOILE(79, 24, 1.05)}`],
  ['5', 'a « à deux étages »', 'Le a classique, avec sa boucle sous une petite voûte (comme dans ce texte). Il ne peut pas être confondu.',
   `<text x="47" y="75" text-anchor="middle" font-family="DM Sans" font-weight="800" font-size="100" fill="url(#g)">a</text>${ETOILE(80, 22, 1.05)}`],
  ['6', 'a mode, à empattements', 'Un a à deux étages avec empattements, plus « magazine », toujours en dégradé sur noir.',
   `<text x="47" y="74" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="98" fill="url(#g)">a</text>${ETOILE(80, 22, 1.05)}`],
];
const g = document.getElementById('grille');
for (const [n, titre, texte, dessin] of formes) {
  const svg = `<svg viewBox="0 0 100 100"><use href="#fond"/>${dessin}</svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="carte"><div class="i170">${svg}</div><div>
    <div class="petits"><span class="num">${n}</span><div class="i60">${svg}</div><div class="i30">${svg}</div></div>
    <div class="txt"><b>${titre}</b><br>${texte}</div></div></div>`);
}
</script>
</body>
</html>
